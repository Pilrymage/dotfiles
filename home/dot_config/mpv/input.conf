# —— 右键呼出菜单（uosc）——
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu   # 键盘的 Menu 键

# —— 在菜单中显示的一些功能（示例）——
# 音轨/字幕/章节/播放列表等（uosc 自带）
a           script-binding uosc/audio              #menu: 音轨
s           script-binding uosc/subtitles          #menu: 字幕
c           script-binding uosc/chapters           #menu: 章节
p           script-binding uosc/items              #menu: 播放列表
o           script-binding uosc/open-file          #menu: 打开 > 文件...
O           script-binding uosc/show-in-directory  #menu: 打开 > 资源管理器中打开

# —— 播放列表管理器 —— 
Shift+ENTER script-binding playlistmanager/showplaylist   #menu: 播放列表 > 显示/管理

# —— 最近播放（二选一）——
# 选 A：recent-menu 用 uosc 作为前端
Ctrl+r  script-message-to recentmenu open-recent-menu uosc   #menu: 最近播放
# 选 B：memo（po5）
# h     script-binding memo-history  #menu: 最近播放（memo）

# —— 缩略图：无需按键，thumbfast 会被 uosc 自动调用 ——
# （如需调试可临时绑定一个键开关 thumbfast）